# Render Blueprint: deploys the FastAPI backend (repo root, Dockerfile) and
# the Next.js frontend (frontend/). In Render: New + -> Blueprint -> this repo.
# Secret keys are asked for in the dashboard; they are never stored in git.
# All backend keys are optional: without them the API runs in fallback mode.
services:
  - type: web
    name: saferoutes-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT # the Dockerfile serves on 8000
        value: "8000"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: '["https://saferoutes-web.onrender.com"]'
      - key: LLM_PROVIDER
        value: openai
      - key: ORS_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: saferoutes-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
